name: Nova Moda CI

on:
  push:
    paths:
      - "nova-moda/**"
      - ".github/workflows/nova-moda-ci.yml"
  pull_request:
    paths:
      - "nova-moda/**"
      - ".github/workflows/nova-moda-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-moda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build Nova Moda
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-moda
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-moda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js app
        run: npm run build
